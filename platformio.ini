[platformio]
default_envs = huawei_a1

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
extra_scripts = post:tools/merge_firmware.py
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

[env:huawei_a1]
# Default revision is A1, with no runtime hardware detection.

[env:huawei_a0]
build_flags =
    ${env.build_flags}
    -DHUAWEI_EPD_REVISION=0
